name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (lint core + dev/test deps; no sentimentai-py needed)
        run: pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
      - name: Lint smoke (the deterministic core must run with zero ML deps)
        run: |
          pip install . --no-deps --force-reinstall
          python -c "import concordai; from concordai.lint import lint_repo; print('lint import OK', concordai.__version__)"
